[package]
name = "nuts-browser-adapter"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
[lib]
crate-type = ["cdylib"]
[dependencies]
nuts-rs = { git = "https://github.com/pymc-devs/nuts-rs", rev = "fa647966938ce4116fb4ced8584229e654ca9035", default-features = false }
rand = "0.10.2"
serde_json = "1.0"
thiserror = "2.0"
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
